defaultConfig {
    applicationId "com.linkshield.sandbox"
    minSdk 26
    targetSdk 34
    versionCode 12
    versionName "2.6.0"

    // ── Security API Keys (Multi-Source Threat Detection) ──
    def safeBrowsingKey = System.getenv("SAFE_BROWSING_API_KEY") ?: ""
    def urlhausKey = System.getenv("URLHAUS_API_KEY") ?: ""
    def threatfoxKey = System.getenv("THREATFOX_API_KEY") ?: ""
    def otxKey = System.getenv("OTX_API_KEY") ?: ""
    def cobaltBaseUrl = System.getenv("COBALT_BASE_URL") ?: "http://141.148.223.177:9001/"
    def cobaltApiKey = System.getenv("COBALT_API_KEY") ?: ""

    // Safely escape strings for BuildConfig
    safeBrowsingKey = safeBrowsingKey.replace('"', '\\"')
    urlhausKey = urlhausKey.replace('"', '\\"')
    threatfoxKey = threatfoxKey.replace('"', '\\"')
    otxKey = otxKey.replace('"', '\\"')
    cobaltBaseUrl = cobaltBaseUrl.replace('"', '\\"')
    cobaltApiKey = cobaltApiKey.replace('"', '\\"')

    buildConfigField "String", "SAFE_BROWSING_API_KEY", "\"${safeBrowsingKey}\""
    buildConfigField "String", "URLHAUS_API_KEY", "\"${urlhausKey}\""
    buildConfigField "String", "THREATFOX_API_KEY", "\"${threatfoxKey}\""
    buildConfigField "String", "OTX_API_KEY", "\"${otxKey}\""
    buildConfigField "String", "COBALT_BASE_URL", "\"${cobaltBaseUrl}\""
    buildConfigField "String", "COBALT_API_KEY", "\"${cobaltApiKey}\""

    // ── Remaining Existing Fields (Unchanged) ──
    buildConfigField "String", "VIRUSTOTAL_API_KEY", '""'
    buildConfigField "String", "PHISHTANK_APP_KEY", '""'
}
