// ============================================================================
// app/build.gradle.kts  (ya app/build.gradle — jo use ho raha hai)
// SAFE_BROWSING_API_KEY ko BuildConfig mein inject karo.
// GitHub Actions mein secret se aa jati hai; local build mein empty string
// — app offline protection pe automatically chali jati hai (crash nahi).
// ============================================================================

android {
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // Pehle yeh line THI NAHI is liye har local build mein key missing
        // thi aur app "Security check unavailable" block screen dikhata tha.
        buildConfigField(
            "String",
            "SAFE_BROWSING_API_KEY",
            "\"${project.findProperty("SAFE_BROWSING_API_KEY") ?: ""}\""
        )
    }
}

