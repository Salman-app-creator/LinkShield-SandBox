        buildConfigField "String", "THREATFOX_API_KEY", "\"df80b746cadaae7f6b2709429084cc37134414a022f6d6bd\""
        buildConfigField "String", "OTX_API_KEY", "\"639e94701367ae2f6b3f96d1950a35a4bfd540c2682d24a0dad9a47dea237ff5\""

