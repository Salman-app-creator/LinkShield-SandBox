plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.linkshield.sandbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.linkshield.sandbox"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "2.6.0"

        // ── Security API Keys (Multi-Source Threat Detection) ──
        def safeBrowsingKey = System.getenv("SAFE_BROWSING_API_KEY") ?: ""
        def urlhausKey = System.getenv("URLHAUS_API_KEY") ?: ""
        def threatfoxKey = System.getenv("THREATFOX_API_KEY") ?: ""
        def otxKey = System.getenv("OTX_API_KEY") ?: ""
        def cobaltBaseUrl = System.getenv("COBALT_BASE_URL") ?: "http://141.148.223.177:9001/"
        def cobaltApiKey = System.getenv("COBALT_API_KEY") ?: ""

        // Safely escape strings for BuildConfig
        safeBrowsingKey = safeBrowsingKey.replace('"', '\\"')
        urlhausKey = urlhausKey.replace('"', '\\"')
        threatfoxKey = threatfoxKey.replace('"', '\\"')
        otxKey = otxKey.replace('"', '\\"')
        cobaltBaseUrl = cobaltBaseUrl.replace('"', '\\"')
        cobaltApiKey = cobaltApiKey.replace('"', '\\"')

        buildConfigField "String", "SAFE_BROWSING_API_KEY", "\"${safeBrowsingKey}\""
        buildConfigField "String", "URLHAUS_API_KEY", "\"${urlhausKey}\""
        buildConfigField "String", "THREATFOX_API_KEY", "\"${threatfoxKey}\""
        buildConfigField "String", "OTX_API_KEY", "\"${otxKey}\""
        buildConfigField "String", "COBALT_BASE_URL", "\"${cobaltBaseUrl}\""
        buildConfigField "String", "COBALT_API_KEY", "\"${cobaltApiKey}\""

        // ── Remaining Existing Fields (Unchanged) ──
        buildConfigField "String", "VIRUSTOTAL_API_KEY", '""'
        buildConfigField "String", "PHISHTANK_APP_KEY", '""'
    }

    buildFeatures {
        compose     true
        buildConfig true
    }

    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "LinkShield-v${defaultConfig.versionName}.apk"
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'io.coil-kt:coil:2.5.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
