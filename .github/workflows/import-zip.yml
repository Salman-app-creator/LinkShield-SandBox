name: Import ZIP Project

on:
  push:
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside the repository"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          if [ -n "${{ inputs.zip_path }}" ]; then
            ZIP="${{ inputs.zip_path }}"
          else
            ZIP=$(find incoming -maxdepth 1 -type f -name '*.zip' | sort | head -1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: No ZIP file found in incoming/"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf _zip_extract
          mkdir -p _zip_extract
          unzip -q "$ZIP" -d _zip_extract
          echo "Extracted contents:"
          find _zip_extract -type f | sort

      - name: Detect and strip wrapper folder
        shell: bash
        run: |
          set -e

          # Agar zip mein ek wrapper folder hai (jaise LinkShield-SandBox-main/)
          # to uske andar ki files use karo
          ITEMS=$(find _zip_extract -mindepth 1 -maxdepth 1 | wc -l)
          FIRST=$(find _zip_extract -mindepth 1 -maxdepth 1 | head -1)

          if [ "$ITEMS" -eq 1 ] && [ -d "$FIRST" ]; then
            echo "Wrapper folder detected: $FIRST"
            echo "MERGE_ROOT=$FIRST" >> "$GITHUB_ENV"
          else
            echo "No wrapper folder — using zip root directly"
            echo "MERGE_ROOT=_zip_extract" >> "$GITHUB_ENV"
          fi

      - name: Merge files into repo
        shell: bash
        run: |
          set -e

          echo "Merging from: $MERGE_ROOT"

          # Sirf zip ki files copy karo repo mein — baaki repo untouched rahe
          # .git, .github, incoming folders ko skip karo
          rsync -av \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'incoming/' \
            --exclude '_zip_extract/' \
            --exclude '*.zip' \
            "$MERGE_ROOT/" ./

          echo "Merge complete"
          echo "Changed files:"
          git diff --name-only || true

      - name: Make gradlew executable
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Cleanup
        shell: bash
        run: |
          rm -rf _zip_extract

      - name: Delete processed ZIP from incoming
        shell: bash
        run: |
          set -e
          rm -f "$ZIP"
          echo "Deleted: $ZIP"

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: merge files from ZIP import"
          git push origin HEAD:main

          echo "Changes committed and pushed"
