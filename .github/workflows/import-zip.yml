name: Import ZIP Project

on:
  push:
    paths:
      - 'incoming/*.zip'

  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside the repository"
        required: true
        default: "incoming/LinkShield-Sandbox-fixed-v2.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine ZIP path
        id: zip
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP="${{ inputs.zip_path }}"
          else
            ZIP=$(find incoming -maxdepth 1 -type f -name '*.zip' | head -1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Using ZIP:"
          echo "$ZIP"
          echo "======================================"

      - name: Prepare import directories
        shell: bash
        run: |
          set -e

          rm -rf _zip_import
          rm -rf _replacement
          rm -rf _protected

          mkdir -p _zip_import
          mkdir -p _replacement
          mkdir -p _protected

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          unzip -q "$ZIP" -d _zip_import

          echo "ZIP extracted successfully."

      - name: Show ZIP contents
        shell: bash
        run: |
          echo "ZIP contents:"
          find _zip_import -maxdepth 5 -type f | head -200

      - name: Detect ZIP mode and apply files
        shell: bash
        run: |
          set -e

          # Check if this is a full project zip (has settings.gradle)
          FULL_PROJECT_ROOT=""

          if [ -f "_zip_import/settings.gradle" ] || \
             [ -f "_zip_import/settings.gradle.kts" ]; then
            FULL_PROJECT_ROOT="_zip_import"
          else
            ROOT=$(find _zip_import \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)
            if [ -n "$ROOT" ]; then
              FULL_PROJECT_ROOT=$(dirname "$ROOT")
            fi
          fi

          if [ -n "$FULL_PROJECT_ROOT" ]; then
            # -------------------------------------------------------
            # FULL PROJECT MODE — poora repo replace karo
            # -------------------------------------------------------
            echo "MODE=full" >> "$GITHUB_ENV"
            echo "PROJECT_ROOT=$FULL_PROJECT_ROOT" >> "$GITHUB_ENV"
            echo "======================================"
            echo "FULL PROJECT MODE detected"
            echo "Project root: $FULL_PROJECT_ROOT"
            echo "======================================"
          else
            # -------------------------------------------------------
            # PARTIAL FILES MODE — sirf changed files merge karo
            # settings.gradle nahi mila = sirf kuch files hain
            # -------------------------------------------------------
            echo "MODE=partial" >> "$GITHUB_ENV"
            echo "PROJECT_ROOT=." >> "$GITHUB_ENV"
            echo "======================================"
            echo "PARTIAL FILES MODE detected"
            echo "Merging changed files into existing repo"
            echo "======================================"

            # Zip ki files seedha repo mein copy karo
            rsync -av \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude 'incoming/' \
              "_zip_import/" ./

            echo "Partial files merged successfully."
          fi

      - name: Prepare full replacement (full mode only)
        shell: bash
        run: |
          set -e

          if [ "$MODE" != "full" ]; then
            echo "Partial mode — skipping full replacement prep."
            exit 0
          fi

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'incoming/' \
            --exclude '_zip_import/' \
            --exclude '_replacement/' \
            --exclude '_protected/' \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            "$PROJECT_ROOT/" _replacement/

          chmod +x _replacement/gradlew

      - name: Preserve working Media Extractor files (full mode only)
        shell: bash
        run: |
          set -e

          if [ "$MODE" != "full" ]; then
            echo "Partial mode — skipping preserve step."
            exit 0
          fi

          echo "Preserving current repository versions..."

          if git ls-files --error-unmatch \
            "app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt" \
            >/dev/null 2>&1; then

            mkdir -p "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber"

            git show HEAD:app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt \
              > "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt"

            echo "Preserved MediaExtractorViewModel.kt"
          fi

          if git ls-files --error-unmatch \
            "app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt" \
            >/dev/null 2>&1; then

            mkdir -p "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber"

            git show HEAD:app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt \
              > "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt"

            echo "Preserved MediaGrabberScreen.kt"
          fi

      - name: Apply protected working files (full mode only)
        shell: bash
        run: |
          set -e

          if [ "$MODE" != "full" ]; then
            echo "Partial mode — skipping apply protected step."
            exit 0
          fi

          rsync -a "_protected/" "_replacement/"

          echo "Protected working files applied."

      - name: Validate Gradle build
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting Gradle build..."
          echo "======================================"

          if [ "$MODE" = "full" ]; then
            cd _replacement
          fi

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon

          echo "======================================"
          echo "Gradle build successful."
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-debug-apk
          path: |
            _replacement/app/build/outputs/apk/debug/*.apk
            _replacement/**/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find . \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found after successful Gradle build."
            exit 1
          fi

          echo "======================================"
          echo "APK found:"
          echo "$APK"
          echo "======================================"

      - name: Replace project files (full mode only)
        shell: bash
        run: |
          set -e

          if [ "$MODE" != "full" ]; then
            echo "Partial mode — no full replacement needed."
            exit 0
          fi

          echo "Replacing repository project..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'incoming' \
            ! -name '_zip_import' \
            ! -name '_replacement' \
            ! -name '_protected' \
            -exec rm -rf {} +

          rsync -a \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            _replacement/ ./

          echo "Repository project replaced successfully."

      - name: Remove temporary directories
        shell: bash
        run: |
          rm -rf _zip_import
          rm -rf _replacement
          rm -rf _protected

      - name: Delete processed ZIP from incoming
        shell: bash
        run: |
          set -e
          rm -f "$ZIP"
          echo "Processed ZIP removed from incoming/: $ZIP"

      - name: Commit imported project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: import updated LinkShield project"

          git push origin HEAD:main
