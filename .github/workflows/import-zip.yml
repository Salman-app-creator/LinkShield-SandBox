name: Import ZIP Project

on:
  push:
    paths:
      - 'incoming/*.zip'

  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside the repository"
        required: true
        default: "incoming/LinkShield-Sandbox-fixed-v2.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout current repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Find ZIP
      # --------------------------------------------------
      - name: Determine ZIP path
        id: zip
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP="${{ inputs.zip_path }}"
          else
            ZIP=$(find incoming -maxdepth 1 -type f -name '*.zip' | head -1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Using ZIP:"
          echo "$ZIP"
          echo "======================================"

      # --------------------------------------------------
      # 3. Prepare temporary directories
      # --------------------------------------------------
      - name: Prepare import directories
        shell: bash
        run: |
          set -e

          rm -rf _zip_import
          rm -rf _replacement
          rm -rf _protected

          mkdir -p _zip_import
          mkdir -p _replacement
          mkdir -p _protected

      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          unzip -q "$ZIP" -d _zip_import

          echo "======================================"
          echo "ZIP extracted successfully."
          echo "======================================"

      # --------------------------------------------------
      # 5. Show ZIP contents
      # --------------------------------------------------
      - name: Show ZIP contents
        shell: bash
        run: |
          echo "ZIP contents:"
          find _zip_import -maxdepth 5 -type f | head -200

      # --------------------------------------------------
      # 6. Detect Android project root
      # --------------------------------------------------
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          if [ -f "_zip_import/settings.gradle" ] || \
             [ -f "_zip_import/settings.gradle.kts" ]; then

            PROJECT_ROOT="_zip_import"

          else

            ROOT=$(find _zip_import \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -z "$ROOT" ]; then
              echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$ROOT")

          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Detected project root:"
          echo "$PROJECT_ROOT"
          echo "======================================"

      # --------------------------------------------------
      # 7. Validate Android project
      # --------------------------------------------------
      - name: Validate Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app directory missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          echo "Android project validation passed."

      # --------------------------------------------------
      # 8. Prepare ZIP project
      # --------------------------------------------------
      - name: Prepare replacement
        shell: bash
        run: |
          set -e

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'incoming/' \
            --exclude '_zip_import/' \
            --exclude '_replacement/' \
            --exclude '_protected/' \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            "$PROJECT_ROOT/" _replacement/

          chmod +x _replacement/gradlew

      # --------------------------------------------------
      # 9. Preserve known working files
      # --------------------------------------------------
      - name: Preserve working Media Extractor files
        shell: bash
        run: |
          set -e

          echo "Preserving current repository versions..."

          if git ls-files --error-unmatch \
            "app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt" \
            >/dev/null 2>&1; then

            mkdir -p "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber"

            git show HEAD:app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt \
              > "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaExtractorViewModel.kt"

            echo "Preserved MediaExtractorViewModel.kt"

          else
            echo "WARNING: Current MediaExtractorViewModel.kt not found."
          fi


          if git ls-files --error-unmatch \
            "app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt" \
            >/dev/null 2>&1; then

            mkdir -p "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber"

            git show HEAD:app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt \
              > "_protected/app/src/main/java/com/linkshield/sandbox/ui/grabber/MediaGrabberScreen.kt"

            echo "Preserved MediaGrabberScreen.kt"

          else
            echo "WARNING: Current MediaGrabberScreen.kt not found."
          fi

      # --------------------------------------------------
      # 10. Put protected files into ZIP project
      # --------------------------------------------------
      - name: Apply protected working files
        shell: bash
        run: |
          set -e

          if [ -d "_protected" ]; then
            rsync -a "_protected/" "_replacement/"
          fi

          echo "Protected working files applied."

      # --------------------------------------------------
      # 11. Build imported project
      # --------------------------------------------------
      - name: Validate Gradle build
        working-directory: _replacement
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting Gradle build..."
          echo "======================================"

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon

          echo "======================================"
          echo "Gradle build successful."
          echo "======================================"

      # --------------------------------------------------
      # 12. Replace repository project
      # --------------------------------------------------
      - name: Replace project files
        shell: bash
        run: |
          set -e

          echo "Replacing repository project..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'incoming' \
            ! -name '_zip_import' \
            ! -name '_replacement' \
            ! -name '_protected' \
            -exec rm -rf {} +

          rsync -a \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            _replacement/ ./

          echo "Repository project replaced successfully."

      # --------------------------------------------------
      # 13. Remove temporary files
      # --------------------------------------------------
      - name: Remove temporary directories
        shell: bash
        run: |
          rm -rf _zip_import
          rm -rf _replacement
          rm -rf _protected

      # --------------------------------------------------
      # 14. Commit imported project
      # --------------------------------------------------
      - name: Commit imported project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: import updated LinkShield project"

          git push origin HEAD:main

      # --------------------------------------------------
      # 15. Find APK
      # --------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          APK=$(find . \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "WARNING: APK not found."
            exit 0
          fi

          echo "======================================"
          echo "APK found:"
          echo "$APK"
          echo "======================================"

      # --------------------------------------------------
      # 16. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
