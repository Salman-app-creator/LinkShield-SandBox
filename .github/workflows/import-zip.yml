name: Import ZIP Project

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside the repository"
        required: true
        default: "incoming/LinkShield-Sandbox-fixed-v2.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP
        run: |
          ZIP="${{ inputs.zip_path }}"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

      - name: Prepare import directory
        run: |
          rm -rf _zip_import
          mkdir -p _zip_import

      - name: Extract ZIP
        run: |
          unzip -q "${{ inputs.zip_path }}" -d _zip_import

      - name: Detect project root
        run: |
          echo "ZIP contents:"
          find _zip_import -maxdepth 3 -type f | head -100

          if [ -f "_zip_import/settings.gradle" ] || \
             [ -f "_zip_import/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=_zip_import" >> "$GITHUB_ENV"
            exit 0
          fi

          DIRS=$(find _zip_import -mindepth 1 -maxdepth 1 -type d)

          COUNT=$(echo "$DIRS" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 1 ]; then
            ROOT=$(echo "$DIRS" | head -1)

            if [ -f "$ROOT/settings.gradle" ] || \
               [ -f "$ROOT/settings.gradle.kts" ]; then
              echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "ERROR: Could not find Android/Gradle project root."
          exit 1

      - name: Validate Android project
        run: |
          test -f "$PROJECT_ROOT/settings.gradle" || \
          test -f "$PROJECT_ROOT/settings.gradle.kts"

          test -d "$PROJECT_ROOT/app"

          echo "Android project validation passed."

      - name: Prepare replacement
        run: |
          rm -rf _replacement
          mkdir -p _replacement

          rsync -a \
            --exclude '.git/' \
            --exclude 'incoming/' \
            --exclude '_zip_import/' \
            --exclude '_replacement/' \
            "$PROJECT_ROOT/" _replacement/

      - name: Validate Gradle project before commit
        working-directory: _replacement
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found. Using system Gradle."
            gradle assembleDebug --stacktrace
          fi

      - name: Replace repository project
        run: |
          mkdir -p _backup

          # Preserve GitHub workflow files and incoming ZIPs.
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'incoming/' \
            --exclude '_zip_import/' \
            --exclude '_replacement/' \
            ./ ./_backup/

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'incoming' \
            ! -name '_zip_import' \
            ! -name '_replacement' \
            -exec rm -rf {} +

          rsync -a _replacement/ ./

      - name: Remove temporary directories
        run: |
          rm -rf _zip_import
          rm -rf _replacement
          rm -rf _backup

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: import updated LinkShield project"
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
