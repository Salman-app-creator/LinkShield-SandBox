name: Import ZIP Project

on:
  push:
    paths:
      - 'incoming/*.zip'

  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside the repository"
        required: true
        default: "incoming/LinkShield-Sandbox-fixed-v2.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine ZIP path
        id: zip
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP="${{ inputs.zip_path }}"
          else
            ZIP=$(find incoming -maxdepth 1 -type f -name '*.zip' | head -1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP"

      - name: Prepare import directory
        run: |
          rm -rf _zip_import
          rm -rf _replacement
          mkdir -p _zip_import
          mkdir -p _replacement

      - name: Extract ZIP
        run: |
          unzip -q "$ZIP" -d _zip_import

      - name: Show ZIP contents
        run: |
          echo "ZIP contents:"
          find _zip_import -maxdepth 4 -type f | head -150

      - name: Detect Android project root
        shell: bash
        run: |
          if [ -f "_zip_import/settings.gradle" ] || \
             [ -f "_zip_import/settings.gradle.kts" ]; then

            echo "PROJECT_ROOT=_zip_import" >> "$GITHUB_ENV"
            exit 0
          fi

          ROOT=$(find _zip_import \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$ROOT")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

      - name: Validate Android project
        shell: bash
        run: |
          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app directory missing."
            exit 1
          fi

          echo "Android project validation passed."

      - name: Prepare clean replacement
        run: |
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'incoming/' \
            --exclude '_zip_import/' \
            --exclude '_replacement/' \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            "$PROJECT_ROOT/" _replacement/

      - name: Validate Gradle build
        working-directory: _replacement
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

      - name: Replace project files
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'incoming' \
            ! -name '_zip_import' \
            ! -name '_replacement' \
            -exec rm -rf {} +

          rsync -a \
            --exclude '.gradle/' \
            --exclude 'build/' \
            --exclude '**/build/' \
            _replacement/ ./

      - name: Remove temporary directories
        run: |
          rm -rf _zip_import
          rm -rf _replacement

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: import updated LinkShield project"
          git push origin HEAD:main

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find . \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "WARNING: APK not found."
            exit 0
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
