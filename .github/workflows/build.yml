name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Psiphon AAR Dependency
        run: |
          mkdir -p app/libs
          ASSET_ID=$(curl -sL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Salman-app-creator/LinkShield-SandBox/releases/tags/v1.0-deps" \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['id'] for a in assets if a['name']=='psiphontunnel.aar'))")
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o app/libs/psiphontunnel.aar \
            "https://api.github.com/repos/Salman-app-creator/LinkShield-SandBox/releases/assets/$ASSET_ID"
          echo "AAR size: $(du -sh app/libs/psiphontunnel.aar)"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
