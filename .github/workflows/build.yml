name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and apply incoming zip
        run: |
          ZIP=$(find incoming/ -maxdepth 1 -name "*.zip" 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            unzip -o "$ZIP" -d _extracted
            INNER=$(find _extracted -mindepth 1 -maxdepth 1 -type d | head -1)
            SRC="${INNER:-./_extracted}"
            echo "Copying from: $SRC"
            if [ -d "$SRC/app" ]; then
              rm -rf ./app
              cp -rf "$SRC/app" ./app
            fi
            if [ -f "$SRC/build.gradle" ]; then
              cp -f "$SRC/build.gradle" ./build.gradle
            fi
            if [ -f "$SRC/settings.gradle" ]; then
              cp -f "$SRC/settings.gradle" ./settings.gradle
            fi
            echo "Override complete"
          else
            echo "No zip in incoming/ — building existing repo"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.txt
        continue-on-error: true

      - name: Check build result
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "FOUND_APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "✅ BUILD SUCCEEDED: $APK_PATH"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ BUILD FAILED: No APK file generated"
          fi

      - name: Upload APK
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-Debug-APK
          path: ${{ env.FOUND_APK_PATH }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build_output.txt
          retention-days: 7

      - name: Create Release with APK
        if: env.BUILD_SUCCESS == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "LinkShield Debug Build #${{ github.run_number }}"
          body: "Auto-build from commit ${{ github.sha }}"
          files: ${{ env.FOUND_APK_PATH }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
