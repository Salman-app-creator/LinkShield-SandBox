name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Psiphon AAR Dependency
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/psiphontunnel.aar "https://github.com/Salman-app-creator/LinkShield-SandBox/releases/download/v1.0-deps/psiphontunnel.aar"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
