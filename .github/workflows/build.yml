name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
      URLHAUS_API_KEY: ${{ secrets.URLHAUS_API_KEY }}
      THREATFOX_API_KEY: ${{ secrets.THREATFOX_API_KEY }}
      OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
      COBALT_BASE_URL: ${{ secrets.COBALT_BASE_URL }}
      COBALT_API_KEY: ${{ secrets.COBALT_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace -PSAFE_BROWSING_API_KEY="${{ secrets.SAFE_BROWSING_API_KEY }}" -PURLHAUS_API_KEY="${{ secrets.URLHAUS_API_KEY }}" -PTHREATFOX_API_KEY="${{ secrets.THREATFOX_API_KEY }}" -POTX_API_KEY="${{ secrets.OTX_API_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          overwrite: true
