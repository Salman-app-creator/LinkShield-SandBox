name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract incoming zip (if present)
        run: |
          ZIP=$(find incoming/ -maxdepth 1 -name "*.zip" 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            unzip -o "$ZIP" -d _extracted
            INNER=$(find _extracted -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ -n "$INNER" ]; then
              echo "Merging from: $INNER"
              cp -rf "$INNER/." .
            else
              cp -rf _extracted/. .
            fi
            echo "Merge complete"
          else
            echo "No zip in incoming/ — building existing repo"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.txt
        continue-on-error: true

      - name: Check build result
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "✅ BUILD SUCCEEDED"
            ls -lh app/build/outputs/apk/debug/
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ BUILD FAILED — see build_output.txt artifact"
          fi

      - name: Upload APK
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LinkShield-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build_output.txt
          retention-days: 7

      - name: Create Release with APK
        if: env.BUILD_SUCCESS == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "LinkShield Debug Build #${{ github.run_number }}"
          body: |
            🤖 Auto-build from commit ${{ github.sha }}
            
            **Install karne ke liye:**
            1. Neeche Assets mein `app-debug.apk` tap karo
            2. Download karo
            3. Install karo
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
